<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成歷史記錄 - Gesture Data Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg': '#121212',
                        'surface': '#1e1e1e',
                        'primary': '#bb86fc',
                        'primary-hover': '#a370db',
                        'secondary': '#03dac6',
                        'text': '#e0e0e0',
                        'text-secondary': '#a0a0a0',
                        'border': '#333',
                        'input': '#2c2c2c',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-bg text-text min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-primary">生成歷史記錄</h1>
                <p class="text-text-secondary mt-1">瀏覽和管理過去的圖片生成記錄</p>
            </div>
            <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-surface border border-primary text-primary rounded-lg hover:bg-primary hover:text-black transition-all">
                <span>🏠</span> 返回首頁
            </a>
        </header>

        <!-- Filters -->
        <div class="bg-surface rounded-xl border border-border p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <!-- Search -->
                <div class="lg:col-span-2">
                    <label class="block text-sm text-text-secondary mb-2">搜尋提示詞</label>
                    <input type="text" id="searchQuery" placeholder="輸入關鍵字搜尋..."
                           class="w-full px-4 py-2 bg-input border border-border rounded-lg focus:border-primary focus:outline-none text-text">
                </div>

                <!-- Mode Filter -->
                <div>
                    <label class="block text-sm text-text-secondary mb-2">生成模式</label>
                    <select id="modeFilter" class="w-full px-4 py-2 bg-input border border-border rounded-lg focus:border-primary focus:outline-none text-text">
                        <option value="">全部模式</option>
                        <option value="variation">情境變異</option>
                        <option value="modification">手勢修改</option>
                    </select>
                </div>

                <!-- Status Filter -->
                <div>
                    <label class="block text-sm text-text-secondary mb-2">狀態</label>
                    <select id="statusFilter" class="w-full px-4 py-2 bg-input border border-border rounded-lg focus:border-primary focus:outline-none text-text">
                        <option value="">全部狀態</option>
                        <option value="success">成功</option>
                        <option value="partial">部分成功</option>
                        <option value="failed">失敗</option>
                    </select>
                </div>

                <!-- Apply Button -->
                <div class="flex items-end">
                    <button onclick="loadHistory(1)" class="w-full px-6 py-2 bg-primary text-black font-semibold rounded-lg hover:bg-primary-hover transition-all">
                        套用篩選
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="flex justify-between items-center mb-4">
            <p class="text-text-secondary">
                共 <span id="totalCount" class="text-primary font-semibold">0</span> 筆記錄
            </p>
            <div class="text-text-secondary text-sm">
                第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 頁
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8">
            <!-- Loading state -->
            <div class="col-span-full text-center py-16 text-text-secondary">
                <p class="text-xl">載入中...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-center gap-2 mb-8">
            <!-- Pagination buttons will be inserted here -->
        </div>

        <!-- Detail Modal -->
        <div id="detailModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
            <div class="bg-surface rounded-2xl border border-border max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-6">
                        <h2 class="text-2xl font-bold text-primary">生成詳情</h2>
                        <button onclick="closeModal()" class="text-text-secondary hover:text-text text-2xl">&times;</button>
                    </div>
                    <div id="modalContent">
                        <!-- Detail content will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const perPage = 12;

        // Load history on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory(1);

            // Enter key to search
            document.getElementById('searchQuery').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadHistory(1);
            });
        });

        async function loadHistory(page) {
            currentPage = page;
            const searchQuery = document.getElementById('searchQuery').value;
            const modeFilter = document.getElementById('modeFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const params = new URLSearchParams({
                page: page,
                per_page: perPage
            });

            if (searchQuery) params.append('q', searchQuery);
            if (modeFilter) params.append('mode', modeFilter);
            if (statusFilter) params.append('status', statusFilter);

            try {
                const response = await fetch(`/api/history?${params}`);
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                renderGrid(data.items);
                renderPagination(data);

                document.getElementById('totalCount').textContent = data.total;
                document.getElementById('currentPage').textContent = data.page;
                document.getElementById('totalPages').textContent = data.pages || 1;

            } catch (error) {
                showError('載入失敗: ' + error.message);
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('historyGrid');

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 border-2 border-dashed border-border rounded-xl">
                        <p class="text-xl text-text-secondary mb-2">尚無生成記錄</p>
                        <p class="text-text-secondary">開始生成圖片後，記錄將顯示在此處</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-surface rounded-xl border border-border overflow-hidden hover:border-primary transition-all group">
                    <!-- Thumbnail -->
                    <div class="relative aspect-video bg-black">
                        ${item.output_images && item.output_images.length > 0
                            ? `<img src="/data/${item.output_images[0]}" alt="Generated" class="w-full h-full object-contain">`
                            : `<div class="w-full h-full flex items-center justify-center text-text-secondary">無圖片</div>`
                        }
                        <!-- Status Badge -->
                        <span class="absolute top-2 right-2 px-2 py-1 text-xs rounded ${getStatusClass(item.status)}">
                            ${getStatusText(item.status)}
                        </span>
                        <!-- Mode Badge -->
                        <span class="absolute top-2 left-2 px-2 py-1 text-xs rounded bg-surface/80 text-primary">
                            ${item.mode === 'variation' ? '情境變異' : '手勢修改'}
                        </span>
                    </div>

                    <!-- Info -->
                    <div class="p-4">
                        <p class="text-sm text-text-secondary mb-2 line-clamp-2" title="${item.prompt || '無提示詞'}">
                            ${item.prompt || '<span class="italic">無提示詞</span>'}
                        </p>
                        <div class="flex justify-between items-center text-xs text-text-secondary">
                            <span>${formatDate(item.created_at)}</span>
                            <span>${item.success_count}/${item.batch_size} 張</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="p-4 pt-0 flex gap-2">
                        <button onclick="showDetail(${item.id})"
                                class="flex-1 px-3 py-2 border border-primary text-primary rounded-lg hover:bg-primary hover:text-black transition-all text-sm">
                            詳情
                        </button>
                        <button onclick="downloadRecord(${item.id})"
                                class="flex-1 px-3 py-2 border border-secondary text-secondary rounded-lg hover:bg-secondary hover:text-black transition-all text-sm">
                            下載
                        </button>
                        <button onclick="deleteRecord(${item.id})"
                                class="px-3 py-2 border border-red-500 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-all text-sm">
                            🗑
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderPagination(data) {
            const pagination = document.getElementById('pagination');

            if (data.pages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let buttons = [];

            // Previous button
            if (data.has_prev) {
                buttons.push(`<button onclick="loadHistory(${data.page - 1})" class="px-4 py-2 bg-surface border border-border rounded-lg hover:border-primary">上一頁</button>`);
            }

            // Page numbers
            const startPage = Math.max(1, data.page - 2);
            const endPage = Math.min(data.pages, data.page + 2);

            for (let i = startPage; i <= endPage; i++) {
                const isActive = i === data.page;
                buttons.push(`
                    <button onclick="loadHistory(${i})"
                            class="px-4 py-2 rounded-lg ${isActive ? 'bg-primary text-black' : 'bg-surface border border-border hover:border-primary'}">
                        ${i}
                    </button>
                `);
            }

            // Next button
            if (data.has_next) {
                buttons.push(`<button onclick="loadHistory(${data.page + 1})" class="px-4 py-2 bg-surface border border-border rounded-lg hover:border-primary">下一頁</button>`);
            }

            pagination.innerHTML = buttons.join('');
        }

        async function showDetail(id) {
            try {
                const response = await fetch(`/api/history/${id}`);
                const item = await response.json();

                if (item.error) {
                    alert(item.error);
                    return;
                }

                const modal = document.getElementById('detailModal');
                const content = document.getElementById('modalContent');

                content.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Images -->
                        <div>
                            <h3 class="text-lg font-semibold mb-4 text-secondary">生成圖片</h3>
                            <div class="grid grid-cols-2 gap-4">
                                ${(item.output_images || []).map((path, i) => `
                                    <div class="bg-black rounded-lg overflow-hidden">
                                        <img src="/data/${path}" alt="Output ${i+1}" class="w-full h-auto">
                                    </div>
                                `).join('')}
                            </div>

                            ${item.seed_image_path ? `
                                <h4 class="text-md font-semibold mt-6 mb-2 text-text-secondary">原始圖片</h4>
                                <img src="/data/${item.seed_image_path}" alt="Seed" class="w-32 h-auto rounded-lg bg-black">
                            ` : ''}

                            ${item.reference_image_path ? `
                                <h4 class="text-md font-semibold mt-4 mb-2 text-text-secondary">參考圖片</h4>
                                <img src="/data/${item.reference_image_path}" alt="Reference" class="w-32 h-auto rounded-lg bg-black">
                            ` : ''}
                        </div>

                        <!-- Details -->
                        <div>
                            <h3 class="text-lg font-semibold mb-4 text-secondary">生成資訊</h3>
                            <div class="space-y-4">
                                <div class="bg-input rounded-lg p-4">
                                    <p class="text-sm text-text-secondary mb-1">模式</p>
                                    <p class="font-medium">${item.mode === 'variation' ? '情境變異生成' : '手勢動作修改'}</p>
                                </div>
                                <div class="bg-input rounded-lg p-4">
                                    <p class="text-sm text-text-secondary mb-1">提示詞</p>
                                    <p class="font-medium">${item.prompt || '無'}</p>
                                </div>
                                <div class="bg-input rounded-lg p-4">
                                    <p class="text-sm text-text-secondary mb-1">使用模型</p>
                                    <p class="font-medium">${item.model}</p>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-input rounded-lg p-4">
                                        <p class="text-sm text-text-secondary mb-1">狀態</p>
                                        <p class="font-medium ${getStatusTextClass(item.status)}">${getStatusText(item.status)}</p>
                                    </div>
                                    <div class="bg-input rounded-lg p-4">
                                        <p class="text-sm text-text-secondary mb-1">成功數量</p>
                                        <p class="font-medium">${item.success_count} / ${item.batch_size} 張</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-input rounded-lg p-4">
                                        <p class="text-sm text-text-secondary mb-1">API 延遲</p>
                                        <p class="font-medium">${item.api_latency_ms ? item.api_latency_ms + ' ms' : 'N/A'}</p>
                                    </div>
                                    <div class="bg-input rounded-lg p-4">
                                        <p class="text-sm text-text-secondary mb-1">建立時間</p>
                                        <p class="font-medium">${formatDateTime(item.created_at)}</p>
                                    </div>
                                </div>
                            </div>

                            ${item.analysis_results ? `
                                <h3 class="text-lg font-semibold mt-6 mb-4 text-secondary">AI 分析結果</h3>
                                <div class="bg-input rounded-lg p-4">
                                    <pre class="text-sm whitespace-pre-wrap">${JSON.stringify(item.analysis_results, null, 2)}</pre>
                                </div>
                            ` : ''}

                            <!-- Action Buttons -->
                            <div class="flex gap-4 mt-6">
                                <button onclick="downloadRecord(${item.id})"
                                        class="flex-1 px-4 py-3 bg-secondary text-black font-semibold rounded-lg hover:opacity-90 transition-all">
                                    下載 ZIP
                                </button>
                                <button onclick="deleteRecord(${item.id}); closeModal();"
                                        class="px-4 py-3 border border-red-500 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-all">
                                    刪除記錄
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                modal.classList.remove('hidden');
                modal.classList.add('flex');

            } catch (error) {
                alert('載入詳情失敗: ' + error.message);
            }
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function downloadRecord(id) {
            window.location.href = `/api/history/${id}/download`;
        }

        async function deleteRecord(id) {
            if (!confirm('確定要刪除此記錄嗎？此操作無法復原。')) {
                return;
            }

            try {
                const response = await fetch(`/api/history/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (result.error) {
                    alert('刪除失敗: ' + result.error);
                    return;
                }

                // Reload current page
                loadHistory(currentPage);

            } catch (error) {
                alert('刪除失敗: ' + error.message);
            }
        }

        function showError(message) {
            const grid = document.getElementById('historyGrid');
            grid.innerHTML = `
                <div class="col-span-full text-center py-16 text-red-500">
                    <p class="text-xl">${message}</p>
                </div>
            `;
        }

        // Helper functions
        function getStatusClass(status) {
            switch (status) {
                case 'success': return 'bg-green-500/20 text-green-400';
                case 'partial': return 'bg-yellow-500/20 text-yellow-400';
                case 'failed': return 'bg-red-500/20 text-red-400';
                default: return 'bg-gray-500/20 text-gray-400';
            }
        }

        function getStatusTextClass(status) {
            switch (status) {
                case 'success': return 'text-green-400';
                case 'partial': return 'text-yellow-400';
                case 'failed': return 'text-red-400';
                default: return 'text-gray-400';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'success': return '成功';
                case 'partial': return '部分成功';
                case 'failed': return '失敗';
                default: return status;
            }
        }

        function formatDate(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatDateTime(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleString('zh-TW');
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Close modal on background click
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeModal();
        });
    </script>
</body>

</html>
